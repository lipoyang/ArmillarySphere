[env:m5stack-basic]
platform = espressif32
board = m5stack-fire
framework = arduino
build_unflags = -DBOARD_HAS_PSRAM # Basic has no PSRAM
lib_deps = 
    m5stack/M5Unified@^0.2.7
    arduino-libraries/ArduinoBLE@^1.4.0
